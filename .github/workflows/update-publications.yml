name: Update publications

on:
  schedule:
    - cron: "0 5 * * 1" # every Monday at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::httr2, any::jsonlite

      - name: Fetch publications from ORCID
        run: Rscript scripts/update-publications.R

      - name: Commit and publish if the list changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The JSON always contains today's date, so compare the BibTeX only
          if git diff --quiet -- data/publications.bib; then
            echo "No new publications."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/publications.bib data/publications.json
          git commit -m "Update publications from ORCID"
          git push
          # Pushes made with GITHUB_TOKEN do not trigger workflows, so start the build explicitly
          gh workflow run publish.yml --ref main
