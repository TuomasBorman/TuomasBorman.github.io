      - "Chair of the Board, The Finnish Society for Bioinformatics, 2026–; board member 2024–2026."
      - "Mentor, Outreachy open-source internship programme, 2023."
      - "Coordinator of the European Bioconductor Conference 2026 organisation; coordinator of CompLifeSci, BioCity Turku, 2022–."

  - title: 9. Teaching merits
    auto: teaching
    items:
