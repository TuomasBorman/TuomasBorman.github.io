  - title: 7. Research output
    items:
      - "**Orchestrating Microbiome Analysis with Bioconductor (OMA)**, 2020–. Open-source R/Bioconductor framework for microbiome data science (<https://microbiome.github.io>). Core developer. Maintainer of the R/Bioconductor packages mia, miaViz, miaTime, HoloFoodR and MGnifyR, and of the OMA online book."
      - "Contributor to several other open-source R packages, including anansi, bluster, miaSim, scater, TreeSummarizedExperiment and vegan."

  - title: 8. Supervision and leadership experience
    items:
