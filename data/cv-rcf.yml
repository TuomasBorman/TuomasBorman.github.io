# CV in the Research Council of Finland (Suomen Akatemia) format:
# https://www.aka.fi/tutkimusrahoitus/hae-rahoitusta/nain-haet-rahoitusta/ohjehakemisto/ansioluettelo/
#
# Rules from the Research Council: at most 3 pages, no photo, only merits
# completed by the call deadline, no impact factors or h-index.
#
# Each section can have:
#   fields:  name/value lines ("auto" = date of the latest change to the CV data)
#   text:    a paragraph (Markdown)
#   use:     copy entries from a section of data/cv.yml,
#            with filter: current (end: present) or previous/completed
#   entries: entries in the same format as data/cv.yml
#   auto:    teaching = summary generated from data/presentations.yml
#   items:   bullet points (Markdown)

# The "Date of CV" is the latest change to any of these files
date_from: [data/cv-rcf.yml, data/cv.yml, data/presentations.yml]

sections:
  - title: 1. Personal details and date of CV
    fields:
      - name: Name
        value: Borman, Tuomas
      - name: ORCID
        value: "[0000-0002-8563-8884](https://orcid.org/0000-0002-8563-8884)"
      - name: Date of CV
        value: auto

  - title: 2. Degrees and academic titles
    use: Education
    filter: completed
    text: |
      Institution that awarded the highest degree: University of Turku, FI-20014 University of Turku, Finland.

  - title: 3. Current employment
    use: Work experience
    filter: current
    items:
