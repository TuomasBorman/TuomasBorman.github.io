# Additions to the publication list fetched from ORCID.
#
# Publications are grouped by the classification used by the Research Council
# of Finland (Ministry of Education and Culture classes A–I):
#   A Peer-reviewed scientific articles      F Public artistic and design activities
#   B Non-peer-reviewed scientific writings  G Theses
#   C Scientific books (monographs)          H Patents and invention disclosures
#   D Publications for professional communities
#   E Publications for the general public    I Audiovisual material, ICT software
#
# ORCID works are classified automatically (journal articles -> A). To change
# the class of an ORCID work, add its DOI here, e.g.  "10.1234/abcd": B
categories: {}

# Works that are not in ORCID. Fields: category, title, authors (list), year,
# venue (free text), url or doi.
