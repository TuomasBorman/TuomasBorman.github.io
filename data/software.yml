# Open-source software shown on the Software page.
#
# Fields
#   name:        package name (required)
#   description: one line (required)
#   type:        Package or Book
#   role:        Maintainer or Contributor
#   url:         home page
#   github:      GitHub repository "owner/name"
#   repository:  Bioconductor, CRAN or GitHub
#   bioc:        true to show the Bioconductor build status badges

- name: mia
  description: Microbiome analysis
  type: Package
  role: Maintainer
  url: https://bioconductor.org/packages/mia
  github: microbiome/mia
  repository: Bioconductor
  bioc: true

- name: miaViz
  description: Microbiome analysis plotting and visualization
  type: Package
  role: Maintainer
  url: https://bioconductor.org/packages/miaViz
  github: microbiome/miaViz
  repository: Bioconductor
  bioc: true

- name: miaTime
